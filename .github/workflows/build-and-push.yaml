# Builds and pushes multi-arch docker images on main, release branches and
# version tags. The tag name is the release version, used as the Maven
# revision and the image tag. Release images are signed. See RELEASING.md.
# Each architecture builds natively (no QEMU) so the JVM AOT cache is correct.

name: Build and Push Docker images
on:
  workflow_dispatch:  # Manual trigger - select branch/tag from GitHub UI
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "Makefile"
      - "ci/**"
      - "pom.xml"
      - ".github/workflows/build-and-push.yaml"
      - ".github/workflows/geoserver-artifacts.yaml"
      - ".github/actions/**"
      - ".gitmodules"
      - "docker-build/**"
      - "config"
      - "geoserver_submodule/**"
      - "src/**"
    tags:
      # Release tags are the bare version: 3.1.0, 3.1.0.1, 3.1.0-M1, 3.1.0-RC1
      - "[0-9]*"

permissions:
  contents: read

# cancel in-progress jobs or runs for the current workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Release version
    if: github.repository == 'geoserver/geoserver-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'

    # A tag is a release. A dispatch on a tag republishes that release.
    # Any other run is a snapshot build.
    - name: Determine the version
      id: version
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ "$REF_TYPE" = "tag" ]; then
          version="$REF_NAME"
          release=true
        else
          version="$(make -s show-version)"
          release=false
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "release=$release" >> "$GITHUB_OUTPUT"
        echo "Building $version (release: $release)"

    # Make must not see the value before the check validates it.
    - name: Release check
      if: steps.version.outputs.release == 'true'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: ci/release-check.sh "$VERSION"

  geoserver-artifacts:
    name: GeoServer artifacts
    needs: version
    if: github.repository == 'geoserver/geoserver-cloud'
    uses: ./.github/workflows/geoserver-artifacts.yaml

  build-base-images:
    needs: [version, geoserver-artifacts]
    if: github.repository == 'geoserver/geoserver-cloud'
    name: Base images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'maven'

    - name: Build GeoServer submodule artifacts
      uses: ./.github/actions/geoserver-artifacts

    - name: Package base images
      run: make package-base-images

    - name: Build base images
      run: |
        TAG="$VERSION" docker compose -f docker-build/base-images.yml build jre
        TAG="$VERSION" docker compose -f docker-build/base-images.yml build spring-boot
        TAG="$VERSION" docker compose -f docker-build/base-images.yml build geoserver-common

    - name: Push base images and extract digests
      run: |
        TAG="$VERSION" docker compose -f docker-build/base-images.yml push
        mkdir -p /tmp/digests
        for image in $(TAG="$VERSION" docker compose -f docker-build/base-images.yml config --images); do
          name=$(echo "$image" | sed 's|.*/||' | cut -d: -f1)
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image" | cut -d@ -f2)
          echo "Image: $image -> $name = $digest"
          echo "$digest" > "/tmp/digests/${name}"
        done

    - name: Upload digests
      uses: actions/upload-artifact@v7
      with:
        name: digests-base-${{ matrix.arch }}
        path: /tmp/digests/*
        retention-days: 1

    - name: Clean up Maven project artifacts
      run: |
        rm -rf ~/.m2/repository/org/geoserver/cloud
        find ~/.m2/repository -name "*SNAPSHOT*" -type d -exec rm -rf {} + 2>/dev/null || true

  stitch-base-manifests:
    needs: [version, build-base-images]
    if: github.repository == 'geoserver/geoserver-cloud'
    name: Stitch base image manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Download amd64 digests
      uses: actions/download-artifact@v8
      with:
        name: digests-base-amd64
        path: /tmp/digests/amd64/

    - name: Download arm64 digests
      uses: actions/download-artifact@v8
      with:
        name: digests-base-arm64
        path: /tmp/digests/arm64/

    - name: Create multi-platform manifests
      run: |
        REPO=$(grep -oP '^REPOSITORY=\K.*' docker-build/.env)
        for file in /tmp/digests/amd64/*; do
          name=$(basename "$file")
          amd64_digest=$(cat "/tmp/digests/amd64/$name")
          arm64_digest=$(cat "/tmp/digests/arm64/$name")
          full_image="${REPO}/${name}:${VERSION}"
          echo "Creating manifest for $full_image"
          docker buildx imagetools create \
            -t "$full_image" \
            "${REPO}/${name}@${amd64_digest}" \
            "${REPO}/${name}@${arm64_digest}"
        done

  build-infrastructure-images:
    needs: [version, stitch-base-manifests, geoserver-artifacts]
    if: github.repository == 'geoserver/geoserver-cloud'
    name: Infrastructure images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'maven'

    - name: Build GeoServer submodule artifacts
      uses: ./.github/actions/geoserver-artifacts

    - name: Package infrastructure apps
      run: make package-infrastructure-images

    - name: Build infrastructure images
      run: |
        TAG="$VERSION" docker compose -f docker-build/infrastructure.yml build

    - name: Push infrastructure images and extract digests
      run: |
        TAG="$VERSION" docker compose -f docker-build/infrastructure.yml push
        mkdir -p /tmp/digests
        for image in $(TAG="$VERSION" docker compose -f docker-build/infrastructure.yml config --images); do
          name=$(echo "$image" | sed 's|.*/||' | cut -d: -f1)
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image" | cut -d@ -f2)
          echo "Image: $image -> $name = $digest"
          echo "$digest" > "/tmp/digests/${name}"
        done

    - name: Upload digests
      uses: actions/upload-artifact@v7
      with:
        name: digests-infra-${{ matrix.arch }}
        path: /tmp/digests/*
        retention-days: 1

    - name: Clean up Maven project artifacts
      run: |
        rm -rf ~/.m2/repository/org/geoserver/cloud
        find ~/.m2/repository -name "*SNAPSHOT*" -type d -exec rm -rf {} + 2>/dev/null || true

  build-geoserver-images:
    needs: [version, stitch-base-manifests, geoserver-artifacts]
    if: github.repository == 'geoserver/geoserver-cloud'
    name: GeoServer ${{ matrix.app }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        # matches app folder names in src/apps/geoserver/* and docker compose service names
        app: ['wms', 'wfs', 'wcs', 'wps', 'gwc', 'restconfig', 'webui']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'maven'

    - name: Build GeoServer submodule artifacts
      uses: ./.github/actions/geoserver-artifacts

    - name: Package GeoServer app
      run: make package-geoserver-app APP=${{ matrix.app }}

    - name: Build GeoServer image
      run: |
        TAG="$VERSION" docker compose -f docker-build/geoserver.yml build ${{ matrix.app }}

    - name: Push image and extract digest
      run: |
        TAG="$VERSION" docker compose -f docker-build/geoserver.yml push ${{ matrix.app }}
        mkdir -p /tmp/digests
        image=$(TAG="$VERSION" docker compose -f docker-build/geoserver.yml \
          config --format json | jq -r '.services."${{ matrix.app }}".image')
        name=$(echo "$image" | sed 's|.*/||' | cut -d: -f1)
        digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image" | cut -d@ -f2)
        echo "Image: $image -> $name = $digest"
        echo "$digest" > "/tmp/digests/${name}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-gs-${{ matrix.app }}-${{ matrix.arch }}
        path: /tmp/digests/*
        retention-days: 1

    - name: Clean up Maven project artifacts
      run: |
        rm -rf ~/.m2/repository/org/geoserver/cloud
        find ~/.m2/repository -name "*SNAPSHOT*" -type d -exec rm -rf {} + 2>/dev/null || true

  stitch-manifests:
    needs: [version, build-infrastructure-images, build-geoserver-images]
    if: github.repository == 'geoserver/geoserver-cloud'
    name: Create multi-platform manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Download amd64 infrastructure digests
      uses: actions/download-artifact@v8
      with:
        name: digests-infra-amd64
        path: /tmp/digests/amd64/

    - name: Download arm64 infrastructure digests
      uses: actions/download-artifact@v8
      with:
        name: digests-infra-arm64
        path: /tmp/digests/arm64/

    - name: Download amd64 geoserver digests
      uses: actions/download-artifact@v8
      with:
        pattern: digests-gs-*-amd64
        path: /tmp/digests/amd64/
        merge-multiple: true

    - name: Download arm64 geoserver digests
      uses: actions/download-artifact@v8
      with:
        pattern: digests-gs-*-arm64
        path: /tmp/digests/arm64/
        merge-multiple: true

    - name: Checkout
      uses: actions/checkout@v7

    - name: Create multi-platform manifests
      run: |
        REPO=$(grep -oP '^REPOSITORY=\K.*' docker-build/.env)
        for file in /tmp/digests/amd64/*; do
          name=$(basename "$file")
          amd64_digest=$(cat "/tmp/digests/amd64/$name")
          arm64_digest=$(cat "/tmp/digests/arm64/$name")
          full_image="${REPO}/${name}:${VERSION}"
          echo "Creating manifest for $full_image"
          docker buildx imagetools create \
            -t "$full_image" \
            "${REPO}/${name}@${amd64_digest}" \
            "${REPO}/${name}@${arm64_digest}"
        done

  sign-images:
    needs: [version, stitch-base-manifests, stitch-manifests]
    # Only release images are signed, never snapshot builds
    if: github.repository == 'geoserver/geoserver-cloud' && needs.version.outputs.release == 'true'
    name: Sign and Verify Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Checkout
      uses: actions/checkout@v7

    - name: Pull all images
      run: |
        make pull-images

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.10.1

    - name: Sign images
      env:
        COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: |
        make sign-image

    - name: Verify image signatures
      env:
        COSIGN_PUB_KEY: ${{ secrets.COSIGN_PUB_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: |
        make verify-image

  github-release:
    needs: [version, sign-images]
    if: github.repository == 'geoserver/geoserver-cloud' && needs.version.outputs.release == 'true'
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # Milestones and release candidates are pre-releases.
    # Latest is the highest version, not the release published last.
    # A republish leaves an existing release alone.
    - name: Create the GitHub release
      run: |
        if gh release view "$VERSION" > /dev/null 2>&1; then
          echo "Release $VERSION exists already, leaving it as it is"
          exit 0
        fi
        gs_version=$(sed -n 's|^ *<gs.version>\(.*\)</gs.version>.*|\1|p' src/pom.xml)
        repository=$(sed -n 's|^REPOSITORY=||p' docker-build/.env)
        case "$VERSION" in
          *-M*|*-RC*)
            mark="--prerelease"
            ;;
          *)
            published=$(gh release list --exclude-drafts --exclude-pre-releases \
              --limit 200 --json tagName --jq '.[].tagName')
            versions=$(printf '%s\n%s\n' "$published" "$VERSION" | sed 's/^v//')
            highest=$(echo "$versions" | sort -V | tail -n 1)
            mark="--latest=false"
            if [ "$highest" = "$VERSION" ]; then
              mark="--latest"
            fi
            ;;
        esac
        notes=$(printf "GeoServer Cloud %s runs GeoServer %s.\n\nDocker images: \`%s/geoserver-cloud-<service>:%s\`, signed with cosign." \
          "$VERSION" "$gs_version" "$repository" "$VERSION")
        gh release create "$VERSION" --verify-tag --title "GeoServer Cloud $VERSION" \
          --notes "$notes" --generate-notes "$mark"
