spring:
  main:
    banner-mode: off
    allow-bean-definition-overriding: true
    allow-circular-references: true # false by default since spring-boot 2.6.0, breaks geoserver initialization
  cloud.bus.enabled: true

logging:
  level:
    org.geoserver.cloud.autoconfigure.catalog.event: info
    org.geoserver.cloud.autoconfigure.event.bus: info
    org.geoserver.cloud.config.catalog.events: info
    org.geoserver.cloud.event: info
    org.geoserver.cloud.event.bus: info
    org.springframework.cloud.bus: info
    org.springframework.cloud.bus.BusAutoConfiguration: info
    org.springframework.cloud.bus.DefaultBusPathMatcher: info
